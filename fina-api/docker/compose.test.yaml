# See compose.e2e.yaml's comment -- pinned so this doesn't collide with it
# under the directory-derived default project name either.
name: fina-test

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fina_test
      POSTGRES_PASSWORD: fina_test
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fina_test -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
  minio:
    # minio/minio on Docker Hub now denies anonymous pulls (MinIO moved
    # distribution to Quay); quay.io/minio/minio is the real, pullable path.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: fina_test
      MINIO_ROOT_PASSWORD: fina_test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 5s
      retries: 30
  createbucket:
    # minio itself never creates buckets; this one-off `mc` run does, then
    # exits. `profiles` keeps plain `up` (no service args) from starting it at
    # all: with no `tests` dependency to prevent it, `up` still starts every
    # service *defined* in this file, and `--abort-on-container-exit` (see
    # README's documented run command) treats any of them exiting -- including
    # this one's intentional exit 0 -- as a reason to tear down the whole
    # stack. Run it to completion first instead, as its own step
    # (`docker compose run --rm createbucket`), before `up` starts `tests`.
    profiles: ["tools"]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: fina_test
      MINIO_ROOT_PASSWORD: fina_test
      MINIO_BUCKET_NAME: audio-fetcher-dev
    entrypoint:
      [
        "sh",
        "-c",
        "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$MINIO_BUCKET_NAME",
      ]
  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile.public
      target: test
    environment:
      FINA_TEST_DATABASE_URL: postgresql+asyncpg://fina_test:fina_test@postgres:5432/postgres
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: fina_test
      MINIO_ROOT_PASSWORD: fina_test
      MINIO_BUCKET_NAME: audio-fetcher-dev
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["sh", "-c", "ruff check . && ruff format --check . && pytest --strict-markers"]
