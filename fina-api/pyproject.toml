[project]
name = "fina"
version = "0.1.0"
description = "FinaAPI modular monolith"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "dishka>=1,<2",
    "audio-analyzer",
    "audio-fetcher",
    "fastapi>=0.116,<1",
    "prometheus-client>=0.20,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.35,<1",
    "vault-secrets",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.1,<10",
    "ruff>=0.12,<1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
audio-analyzer = { workspace = true }
audio-fetcher = { workspace = true }
vault-secrets = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fina"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
