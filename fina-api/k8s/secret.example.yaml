# Template only -- do not apply this file as-is and do not commit real
# values into it. Populate these two Secrets out-of-band instead:
# `kubectl create secret generic ... --from-literal=...`, a secrets
# manager integration (Sealed Secrets, External Secrets Operator, Vault),
# or your CI/CD pipeline.
#
# Split in two, deliberately: the migration Job (see migration-job.yaml)
# only ever constructs fina.config.DatabaseSettings, so it only needs
# fina-database-url. It must never be given fina-mcp-api-key.
apiVersion: v1
kind: Secret
metadata:
  name: fina-database-url
  labels:
    app.kubernetes.io/name: fina
type: Opaque
stringData:
  url: "CHANGEME-postgresql+asyncpg://user:password@host:5432/dbname"
---
apiVersion: v1
kind: Secret
metadata:
  name: fina-mcp-api-key
  labels:
    app.kubernetes.io/name: fina
type: Opaque
stringData:
  apiKey: "CHANGEME"
