# Run once, before rolling out a Deployment that expects the schema
# revision this Job applies. Never run migrations from the app's own
# startup command -- see README's "Container deployment".
#
# Jobs are immutable: the name is suffixed with the target revision so
# each schema-changing release gets its own Job object instead of trying
# to edit/rerun a completed one. See k8s/README.md's maintenance
# procedure for the full rollout order this depends on.
apiVersion: batch/v1
kind: Job
metadata:
  name: fina-migrate-0001-initial-schema
  labels:
    app.kubernetes.io/name: fina
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fina
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migrate
          image: fina:latest # pin to the exact tag being rolled out
          command: ["alembic", "upgrade", "head"]
          env:
            # DatabaseSettings only -- this Job must never be given
            # fina-mcp-api-key; alembic/env.py never constructs the full
            # Settings, only DatabaseSettings. There is no database-URL
            # secret: db_password comes from Vault (VAULT_* below, same
            # mechanism the application uses for its own secrets), and only
            # the non-secret connection details below are plain values.
            - name: FINA_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: fina-database
                  key: host
            - name: FINA_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: fina-database
                  key: port
            - name: FINA_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: fina-database
                  key: user
            - name: FINA_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: fina-database
                  key: name
            - name: VAULT_URL
              valueFrom:
                configMapKeyRef:
                  name: fina-vault
                  key: url
            - name: VAULT_ENGINE
              valueFrom:
                configMapKeyRef:
                  name: fina-vault
                  key: engine
            - name: VAULT_SECRET_PATH
              valueFrom:
                configMapKeyRef:
                  name: fina-vault
                  key: secret_path
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: fina-vault-approle
                  key: role_id
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: fina-vault-approle
                  key: secret_id
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
