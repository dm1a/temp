# Submitted by migrate.sh with the exact application image being deployed.
# Kubernetes generates a fresh name for every attempt; completed Jobs are never reused.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: fina-migrate-0001-initial-schema-
  labels:
    app.kubernetes.io/name: fina
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fina
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migrate
          image: fina:replace-in-ci # migrate.sh requires the exact deployment image
          command: ["alembic", "upgrade", "head"]
          envFrom:
            # The same ConfigMap the application Deployment reads, so the
            # Job's connection details can never drift from the app's.
            # DatabaseSettings ignores the keys it does not recognise.
            - configMapRef:
                name: config-fina
          env:
            # DatabaseSettings only -- this Job must never be given
            # fina-mcp-api-key; alembic/env.py never constructs the full
            # Settings, only DatabaseSettings. There is no database-URL
            # secret: db_password comes from Vault, resolved over the
            # AppRole below, the same mechanism the application uses.
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: common-vault
                  key: VAULT_ROLE_ID_AI_AGENTS
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: common-vault
                  key: VAULT_SECRET_ID_AI_AGENTS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
