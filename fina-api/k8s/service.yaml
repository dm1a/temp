# Public: routes to port 8000 (/api/v1/*) only. Safe to front with an
# Ingress.
apiVersion: v1
kind: Service
metadata:
  name: fina
  labels:
    app.kubernetes.io/name: fina
spec:
  selector:
    app.kubernetes.io/name: fina
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Internal only: routes to port 9000 (/probes/*, /internal/tasks/*,
# /metrics). /internal/tasks/discovery deliberately has no authentication
# -- never create an Ingress (or any other externally reachable route) for
# this Service. Kubelet's own probes talk to the pod IP directly and don't
# need this Service; it exists for other in-cluster callers (a future
# discovery-trigger CronJob, a Prometheus scrape, manual in-cluster
# debugging).
apiVersion: v1
kind: Service
metadata:
  name: fina-internal
  labels:
    app.kubernetes.io/name: fina
spec:
  selector:
    app.kubernetes.io/name: fina
  ports:
    - name: management
      port: 9000
      targetPort: management
