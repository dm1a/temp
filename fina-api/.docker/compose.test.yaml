name: fina-test-corporate

services:
  postgres:
    image: cr.ci.sberinsur.local/dockerhub/library/postgres:15-alpine
    environment:
      POSTGRES_USER: fina_test
      POSTGRES_PASSWORD: fina_test
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fina_test -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
  minio:
    image: cr.ci.sberinsur.local/quay/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: fina_test
      MINIO_ROOT_PASSWORD: fina_test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 5s
      retries: 30
  createbucket:
    profiles: ["tools"]
    image: cr.ci.sberinsur.local/quay/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      FINA_S3_ACCESS_KEY: fina_test
      FINA_S3_SECRET_KEY: fina_test
      FINA_S3_BUCKET_NAME: audio-fetcher-dev
    entrypoint:
      [
        "sh",
        "-c",
        "mc alias set local http://minio:9000 $$FINA_S3_ACCESS_KEY $$FINA_S3_SECRET_KEY && mc mb --ignore-existing local/$$FINA_S3_BUCKET_NAME",
      ]
  tests:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: test
    environment:
      FINA_TEST_DATABASE_URL: postgresql+asyncpg://fina_test:fina_test@postgres:5432/postgres
      FINA_S3_ENDPOINT_URL: http://minio:9000
      FINA_S3_ACCESS_KEY: fina_test
      FINA_S3_SECRET_KEY: fina_test
      FINA_S3_BUCKET_NAME: audio-fetcher-dev
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["sh", "-c", "ruff check . && ruff format --check . && pytest --strict-markers"]
