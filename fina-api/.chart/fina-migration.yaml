{{- /* The deploy:develop job copies this into the downloaded common chart. */ -}}
{{- $configGen := index .Values "config-gen" | default dict -}}
{{- $config := dig "extraConfigMaps" "config-fina" (dict) $configGen -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate" .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: fina
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fina
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migrate
          image: {{ required "Set finaMigrationImage to the exact application image being deployed" .Values.finaMigrationImage | quote }}
          command: ["alembic", "upgrade", "head"]
          env:
            # Render from the same values that create config-fina. Pre-install
            # runs before that ConfigMap exists; pre-upgrade precedes its update.
            {{- range $key := list "FINA_DB_HOST" "FINA_DB_PORT" "FINA_DB_USER" "FINA_DB_NAME" "VAULT_URL" "VAULT_ENGINE" "VAULT_SECRET_PATH" }}
            - name: {{ $key }}
              value: {{ required (printf "config-gen.extraConfigMaps.config-fina.%s is required for migration" $key) (index $config $key) | quote }}
            {{- end }}
            # DatabaseSettings resolves db_password through the same Vault
            # AppRole as the app, without requiring an MCP API key.
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: common-vault
                  key: VAULT_ROLE_ID_AI_AGENTS
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: common-vault
                  key: VAULT_SECRET_ID_AI_AGENTS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
