[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-analyzer"
version = "0.1.0"
description = "Stand-in for the not-yet-published FINA Analyzer SDK, mirroring its draft shape."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_analyzer"]
